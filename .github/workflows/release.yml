name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution zip (TelScope code + docs only)
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="TelScope-${GITHUB_REF_NAME}"
          # Zip contains ONLY our MIT code + docs. No third-party code/binaries:
          # those are fetched by bootstrap.py on the user's machine at first run.
          zip -r "dist/${NAME}.zip" . \
            -x ".git/*" ".github/*" "docs/site/*" "dist/*" \
               "vendor/*" "bin/*" "venv/*" "reports/*" "*.db" \
               "TelScope-repo/*" "*.zip" "__pycache__/*" "*/__pycache__/*"
          (cd dist && sha256sum "${NAME}.zip" > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TelScope-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
